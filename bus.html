        // login btn part
        function login() {
            // hard-coded correct credentials (for practice only)
            const correctUsername = "";
            const correctPassword = "pass123";

            const username = window.prompt("Enter your username:");
            const password = window.prompt("Enter your password:");

            if (password === correctPassword) {
                // show "hello username" instead of the button
                const btn = document.getElementById("loginBtn");
                const greet = document.getElementById("greet");

                btn.style.display = "none";                // hide button
                greet.innerHTML = "welcome " + username;     // show greeting
            } else {
                alert("Invalid username or password");
            }
        }

        let isLogin = true;

        // open modal
        function openAuth() {
            document.getElementById("authModal").style.display = "flex";
        }

        // close modal
        function closeAuth() {
            document.getElementById("authModal").style.display = "none";
        }

        // toggle login/signup
        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById("authTitle").innerText = isLogin ? "Login" : "Sign Up";
            document.querySelector(".auth-box button").innerText = isLogin ? "Login" : "Sign Up";
            document.querySelector(".toggle-text").innerHTML =
                isLogin
                    ? `Don’t have an account? <span onclick="toggleAuth()">Sign Up</span>`
                    : `Already have an account? <span onclick="toggleAuth()">Login</span>`;
        }

        // login/signup handler
        function handleAuth() {
            const username = document.getElementById("authUsername").value.trim();
            const password = document.getElementById("authPassword").value.trim();

            if (!username || !password) {
                alert("Please fill all fields");
                return;
            }

            if (isLogin) {
                const savedUser = JSON.parse(localStorage.getItem("busUser"));

                if (!savedUser || savedUser.username !== username || savedUser.password !== password) {
                    alert("Invalid credentials");
                    return;
                }
            } else {
                localStorage.setItem("busUser", JSON.stringify({ username, password }));
            }

            // success
            document.getElementById("authBtn").style.display = "none";
            document.getElementById("greet").innerText = `Welcome ${username}`;
            closeAuth();
        }

        // auto login if already logged in
        window.onload = () => {
            const user = JSON.parse(localStorage.getItem("busUser"));
            if (user) {
                document.getElementById("authBtn").style.display = "none";
                document.getElementById("greet").innerText = `Welcome ${user.username}`;
            }
        };

    </script>

            <span class="close-btn" onclick="closeAuth()">&times;</span>

            <h3 id="authTitle">Login</h3>

            <input type="text" id="authUsername" placeholder="Username">
            <input type="password" id="authPassword" placeholder="Password">

            <button class="btn btn-primary w-100" onclick="handleAuth()">Login</button>

            <p class="toggle-text">
                Don’t have an account?
                <span onclick="toggleAuth()">Sign Up</span>
            </p>
        </div>
    </div>


</body>

</html>
